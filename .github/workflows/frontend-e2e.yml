name: Frontend Tests (disabled)

# This workflow has been disabled by the cleanup chore to avoid running E2E/unit tests
# in CI automatically while test artifacts and Playwright configs are removed.
# To run tests manually, use the workflow_dispatch event or re-enable the steps below.

on:
  workflow_dispatch: {}

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Notice
        run: echo "Frontend tests are disabled in CI. Re-enable this workflow to run unit/e2e tests in CI."
