name: Quality Gates

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch: {}

jobs:
  backend-quality:
    name: Backend quality (checks + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: rta_rts_db
          POSTGRES_USER: rta_user
          POSTGRES_PASSWORD: rta123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rta_user -d rta_rts_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: rta_rts_db
      DB_USER: rta_user
      DB_PASSWORD: rta123
      DB_HOST: localhost
      DB_PORT: 5432
      DEBUG: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run Python syntax gate
        run: python -m compileall backend
      - name: Run Django system checks
        run: |
          cd backend
          python manage.py check
      - name: Run backend unit test gate
        run: |
          cd backend
          python manage.py run_unit_tests

  frontend-quality:
    name: Frontend quality (tests + build)
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend test gate
        working-directory: frontend
        run: npm test -- --watchAll=false --runInBand
      - name: Build frontend
        working-directory: frontend
        run: npm run build
